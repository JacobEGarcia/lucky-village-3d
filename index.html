function sakuraFade(){

  const tx=g.position.x,tz=g.position.z;
  const ax=cam.position.x,az=cam.position.z,dx=player.x-ax,dz=player.z-az;
  const len2=dx*dx+dz*dz;let tt=len2?((tx-ax)*dx+(tz-az)*dz)/len2:0;tt=clamp(tt,0,1);
  const near=Math.hypot(tx-(ax+dx*tt),tz-(az+dz*tt))<1.8&&tt<.92;
  const target=near?.16:1;
  const op=g.userData.op===undefined?1:g.userData.op;
  const nop=lerp(op,target,.14);
  if(Math.abs(nop-op)>.001||g.userData.wasFaded){
   g.userData.op=nop;
   g.traverse(o=>{if(o.material&&o.geometry&&o.geometry.type==='SphereGeometry'&&o.position.y>2){
    o.material.transparent=nop<.995;o.material.opacity=nop;o.material.depthWrite=nop>.5;}});
   g.userData.wasFaded=nop<.995;
  }
 }
}
