   tone(2637,.45,'sine',.016);setTimeout(()=>tone(3520,.55,'sine',.011),150);}
  else if(state==='play'&&fd<8&&Math.random()<dt*.012&&t>fu.chimeT){
   fu.chimeT=t+18;fu.amp=.25;tone(2637,.5,'sine',.02);}
  if(fu.amp>0){fu.amp=Math.max(0,fu.amp-dt*.25);
   fu.g.rotation.z=Math.sin(t*7)*fu.amp;
   fu.g.rotation.x=Math.cos(t*5.3)*fu.amp*.6;}
 }
}
/* noren strips breathe with the wind - slow base sway, gusts every few seconds */
let gustT=3,gustV=.6;
function windNow(){return .6+.4*Math.sin(t*.23)+.5*gustV*Math.max(0,Math.sin(t*1.3));}
function updNoren(dt){
 gustT-=dt;if(gustT<=0){gustT=R(4,9);gustV=R(.4,1);}
 const w=windNow();
 for(const s of norenStrips){const ph=s.userData.ph;
  const sw=.5+.5*Math.sin(t*1.1+ph)+.18*Math.sin(t*2.3+ph*2);
  const sw2=.5+.5*Math.sin(t*1.1+ph-1.0)+.18*Math.sin(t*2.3+ph*2-1.6);
  if(NORFIX!=null){s.rotation.x=NORFIX;s.userData.bot.rotation.x=NORFIX*.7;}
  else{s.rotation.x=-Math.min(.2,Math.max(0,.13*w*sw));
   s.userData.bot.rotation.x=-Math.min(.34,Math.max(0,.22*w*sw2));}}
}
/* shooting stars - rare streaks on clear nights, same line language as the rain */
const metGeo=new THREE.BufferGeometry(),metPos=new Float32Array(6);
metGeo.setAttribute('position',new THREE.BufferAttribute(metPos,3));
const metMat=new THREE.LineBasicMaterial({color:0xf2e6c4,transparent:true,opacity:0,fog:false,blending:THREE.AdditiveBlending,depthWrite:false});
const meteor=new THREE.Line(metGeo,metMat);meteor.frustumCulled=false;meteor.visible=false;scene.add(meteor);
const mhcv=document.createElement('canvas');mhcv.width=mhcv.height=64;
const mhg=mhcv.getContext('2d');
const mhgr=mhg.createRadialGradient(32,32,1,32,32,32);
mhgr.addColorStop(0,'rgba(255,248,228,.95)');mhgr.addColorStop(.35,'rgba(242,230,196,.5)');mhgr.addColorStop(1,'rgba(242,230,196,0)');
mhg.fillStyle=mhgr;mhg.fillRect(0,0,64,64);
const metHead=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(mhcv),transparent:true,opacity:0,fog:false,blending:THREE.AdditiveBlending,depthWrite:false}));
metHead.scale.setScalar(.9);metHead.visible=false;scene.add(metHead);
const met={on:false,t0:0,next:METFAST?0:9,sx:0,sy:0,sz:0,dx:0,dy:0,dz:0};let mets=0;
function updMeteor(dt){
 if(phase()==='night'&&!raining()){
  if(METPIN&&!met.on){met.on=true;met.t0=t-.375;mets++;
   met.sx=-14;met.sy=3.8;met.sz=-27;met.dx=15;met.dy=-2;met.dz=1;}
  if(!met.on&&t>met.next){met.on=true;met.t0=t;mets++;
   met.sx=R(-24,16);met.sy=R(3,4.6);met.sz=R(-30,-22);
   const a=R(-.6,.6);met.dx=R(12,20)*Math.cos(a);met.dy=-R(1.5,3);met.dz=R(2,5)*Math.sin(a);}
  if(met.on){const k=METPIN?.5:(t-met.t0)/.75;
   if(k>=1&&!METPIN){met.on=false;meteor.visible=false;metHead.visible=false;metMat.opacity=0;metHead.material.opacity=0;met.next=t+(METFAST?1.2:R(16,38));}
   else{meteor.visible=true;metHead.visible=true;metMat.opacity=Math.sin(k*Math.PI);metHead.material.opacity=Math.sin(k*Math.PI);
    const h=Math.min(1,k*1.25),tl=Math.max(0,k*1.25-.22);
    metPos[0]=met.sx+met.dx*tl;metPos[1]=met.sy+met.dy*tl;metPos[2]=met.sz+met.dz*tl;
    metPos[3]=met.sx+met.dx*h;metPos[4]=met.sy+met.dy*h;metPos[5]=met.sz+met.dz*h;
    metGeo.attributes.position.needsUpdate=true;
    const v=new THREE.Vector3(metPos[3],metPos[4],metPos[5]).project(cam);
    metHead.position.set(metPos[3],metPos[4],metPos[5]);
    window._metXY=(v.x*50+50).toFixed(0)+','+(-v.y*50+50).toFixed(0);}}}
 else if(met.on){met.on=false;meteor.visible=false;metHead.visible=false;metMat.opacity=0;metHead.material.opacity=0;met.next=t+R(4,8);}
}
/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000)*WARP;last=now;t+=dt;
 if(PIN!=null)p=PIN;else{p+=dt/DAY_LEN;if(p>=1){p-=1;day++;rollRain();basket={n:0,v:0};save();updHUD();}}
 updDay();
 if(state!=='menu'){updPlayer(dt);updNeighbor(mugi,MUGIWPS,dt);updNeighbor(sora,SORAWPS,dt);updFish(dt);updAct();}
 ghostFollow();
 updFx(dt);updRain(dt);updHig(dt);updBird(dt);updNoren(dt);updMeteor(dt);updCam(dt);drawFloats();
 renderer.render(scene,cam);
}
requestAnimationFrame(frame);
/* ---------- init hooks ---------- */
if(Q.has('play')||AUTO){hide('menu');state='play';$('hud').classList.add('on');$('bar').classList.add('on');}
if(Q.get('gaze')==='bridge'){sora.x=BRG.x;sora.z=BRG.z;sora.st='gaze';sora.dir=-1.57;sora.gazePh='dusk';sora.wp=null;sora.bolt=false;sora.duskGaze=false;}
if(Q.get('gaze')==='nap'){sora.x=BRG.x;sora.z=BRG.z;sora.st='gaze';sora.dir=-1.57;sora.gazePh=null;sora.gazeP=[.22,.38];sora.napping=true;sora.wp=null;sora.bolt=false;sora.duskGaze=false;sora.napGo=false;}
if(Q.get('gaze')==='tend'){mugi.x=-2.8;mugi.z=-15.2;mugi.st='gaze';mugi.dir=.3;mugi.gazePh=null;mugi.gazeP=[.16,.46];mugi.tending=true;mugi.wp=null;mugi.bolt=false;}
if(Q.get('gaze')==='1'){for(const nb of[mugi,sora]){if(!nb.seat)continue;nb.x=nb.seat[0];nb.z=nb.seat[1];nb.st='gaze';nb.dir=.15;nb.gazePh=null;nb.wp=null;nb.bolt=false;}}
if(Q.has('sleep')){for(const nb of[mugi,sora]){nb.x=nb.home[0][0];nb.z=nb.home[0][1];nb.inside=true;nb.op=0;applyOp(nb);nb.g.visible=false;}}
if(Q.has('card')){hide('menu');state='play';setTimeout(()=>$('cardbtn').click(),600);}
if(Q.has('fishat')){hide('menu');state='play';$('hud').classList.add('on');$('bar').classList.add('on');
 player.x=POND.x-POND.r-1.2;player.z=POND.z+1;setTimeout(()=>startFishing(),400);}
const AT=Q.get('at');
if(AT){const[a,b]=AT.split(',').map(Number);if(!isNaN(a)&&!isNaN(b)){hide('menu');state='play';player.x=a;player.z=b;}}
if(Q.has('cur')){stillT=99;curQ=.85;}
if(Q.has('burst')){let bi=0,bd=1e9;for(let gi=0;gi<GROVE.length;gi++){const[gx,gz]=GROVE[gi];const dd=Math.hypot(player.x-gx,player.z-gz);if(dd<bd){bd=dd;bi=gi;}}kickTree(bi);}
if(Q.get('close')==='1'){sora.x=player.x+.9;sora.z=player.z+.6;sora.st='sit';sora.timer=30;sora.wp=null;sora.napDay=day;sora.lastPh=phase();}
if(Q.get('catchtest')){hide('menu');state='play';$('hud').classList.add('on');$('bar').classList.add('on');const _ct=()=>{fish.species=FISH.find(f=>f.id===Q.get('catchtest'))||FISH[0];fish.bx=POND.x;fish.bz=POND.z;land();};setTimeout(_ct,700);setInterval(_ct,1200);}
if(Q.has('talk')){hide('menu');state='play';$('hud').classList.add('on');$('bar').classList.add('on');setTimeout(()=>talk(Q.get('talk')==='sora'?sora:mugi),700);}
if(PLC&&DECOR[PLC]){hide('menu');state='play';$('hud').classList.add('on');$('bar').classList.add('on');setTimeout(()=>{koban+=DECOR[PLC].v;startPlace(PLC);setTimeout(()=>placeAt(player.x+3.2,player.z-1.6),450);},500);}
if(Q.has('cardpng')){setTimeout(()=>{const u=renderCard();document.body.innerHTML='';const im=new Image();im.src=u;im.style.cssText='position:fixed;inset:0;width:1200px;height:630px;display:block';document.body.appendChild(im);},700);}
const FM=Q.get('fmode');
if(FM)setTimeout(()=>{fish.mode=FM;fish.biteT=9;fish.wait=9;},700);
